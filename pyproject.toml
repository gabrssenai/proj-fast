[project]
name = "proj-fast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "typos>=1.49.0",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = [
    '-p', 'no:warnings',
    '--cov=proj_fast',
    '--cov-context=test',
]

[tool.typos.files]
extend-exclude = ['*.md']

[tool.poe.tasks]
lint = { cmd = 'ruff check' }
format.sequence = [
    { cmd = 'ruff check --fix' },
    { cmd = 'ruff format' },
]
serve = 'fastapi dev proj_fast/app.py'
test.sequence = [
    'lint',
    { cmd = 'pytest -s -x -vv' },
    { cmd = 'coverage html --show-contexts' },
]
